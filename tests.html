<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ชุดทดสอบระบบนัดคิวทำงาน (Unit Tests - Zero Emoji Policy)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px; font-size: 14px; }
    .container { max-width: 860px; margin: 0 auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; }
    h1 { margin-top: 0; font-size: 18px; color: #0f172a; }
    .summary-pass { padding: 10px 14px; background: #dcfce7; border-left: 4px solid #16a34a; color: #14532d; font-weight: 700; margin-bottom: 14px; }
    .summary-fail { padding: 10px 14px; background: #fee2e2; border-left: 4px solid #dc2626; color: #7f1d1d; font-weight: 700; margin-bottom: 14px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    li.pass { color: #15803d; }
    li.fail { color: #b91c1c; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ชุดทดสอบอัตโนมัติ: ระบบนัดคิวทำงาน v2.5.0 (Zero-Emoji Policy)</h1>
    <div id="testSummary">กำลังประมวลผลการทดสอบ...</div>
    <ul id="testList"></ul>
  </div>
  <script src="patchnotes.js"></script>
  <script src="logic.js"></script>
  <script src="tests.js"></script>
</body>
</html>
